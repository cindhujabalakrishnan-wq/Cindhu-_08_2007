spring:
  datasource:
    url: ${DB_URL:?DB_URL must be set}
    username: ${DB_USERNAME:?DB_USERNAME must be set}
    password: ${DB_PASSWORD:?DB_PASSWORD must be set}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:?MAIL_HOST must be set}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:?MAIL_USERNAME must be set}
    password: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.insurance.platform: INFO
    org.hibernate.SQL: WARN

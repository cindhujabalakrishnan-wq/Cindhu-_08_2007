spring:
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-for-local-dev-only-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  file:
    storage-path: ${FILE_STORAGE_PATH:./uploads}
    max-size: ${APP_FILE_MAX_SIZE:10MB}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@insurance.local}
    password: ${ADMIN_PASSWORD:Admin@123}
    seed: ${SEED_ADMIN:true}
  scheduler:
    cron: ${SCHEDULER_CRON:0 0 8 * * *}

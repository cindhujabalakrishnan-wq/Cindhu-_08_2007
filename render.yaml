services:
  - type: web
    name: insurance-backend
    runtime: java
    plan: free
    buildCommand: cd backend && ./mvnw -B clean package -DskipTests
    startCommand: java -jar backend/target/*.jar
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_VERSION
        value: "17"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN
        value: "true"
      - key: DEMO_SEED
        value: "true"
      - key: FILE_STORAGE_PATH
        value: /var/data/uploads
      - key: APP_FILE_MAX_SIZE
        value: 10MB
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SCHEDULER_CRON
        value: 0 0 8 * * *
